packages:
  - packages/*
  - packages/**/*

catalog:
  # Core dependencies
  typescript: ^6.0.3
  vitest: ^5.0.5
  '@types/node': ^26.6.5

  # Linting & formatting
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.10
  globals: ^17.13.0

  # Testing utilities
  '@vitest/coverage-v8': ^5.0.5

  # Build utilities
  tsx: ^4.19.0
  rimraf: ^6.0.0

  # MCP dependencies (for mcp-server)
  '@modelcontextprotocol/sdk': ^1.0.0

  # OpenCode plugin types (for opencode-plugin)
  '@opencode-ai/types': ^0.1.0

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  '@rolldown/binding-darwin-arm64': true
  '@rolldown/binding-darwin-x64': true
  '@rolldown/binding-linux-x64': true
  '@rolldown/binding-linux-x64-musl': true
